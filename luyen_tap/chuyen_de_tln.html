<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyên đề Trả lời ngắn Mức Vận dụng 2026 — Toán THPTQG</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="manifest" href="../manifest.json">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="topbar-brand">
        <a class="btn btn-sm" href="../index.html">← Dashboard</a>
        <h1>Chuyên đề Trả lời ngắn Mức Vận dụng 2026</h1>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-sm btn-primary" href="phong_thi_toan.html?mode=tln_de1">Làm Đề TLN 01</a>
        <a class="btn btn-sm" href="phong_thi_toan.html?mode=tln_de2">Làm Đề TLN 02</a>
        <a class="btn btn-sm" href="phong_thi_toan.html?mode=tln_hot20">Thi 20 câu HOT</a>
        <button class="btn btn-sm" type="button" data-theme-toggle>Chế độ Tối</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tab-bar" id="tlnTabBar" aria-label="Điều hướng Chuyên đề Trả lời ngắn" style="margin-bottom: 24px;">
      <button type="button" class="tab-btn active" data-tln-tab="tongquan">Tổng quan &amp; Chiến lược</button>
      <button type="button" class="tab-btn" data-tln-tab="de_truong">Câu vận dụng từ đề trường</button>
      <button type="button" class="tab-btn" data-tln-tab="cd1">CĐ 1: GTLN–GTNN (C1-MHH2.2)</button>
      <button type="button" class="tab-btn" data-tln-tab="cd2">CĐ 2: Khảo sát &amp; Đồ thị (C2-GQ2.2)</button>
      <button type="button" class="tab-btn" data-tln-tab="cd3">CĐ 3: Xác suất (C3-MHH2.2)</button>
      <button type="button" class="tab-btn" data-tln-tab="cd4">CĐ 4: Vectơ 3D (C4-MHH2.2)</button>
      <button type="button" class="tab-btn" data-tln-tab="cd56">Mở rộng Hiểu: C5 &amp; C6</button>
      <button type="button" class="tab-btn" data-tln-tab="hot20">Tuyển tập 20 câu "HOT" 2026</button>
    </nav>

    <div id="tabPanel"></div>
  </main>

  <!-- Modal đẩy lỗi sai vào Nhật ký -->
  <div class="modal-backdrop" id="errModal" role="dialog" aria-modal="true" aria-labelledby="errModalTitle">
    <div class="modal-card">
      <h3 id="errModalTitle">Đẩy câu sai vào Nhật ký lỗi</h3>
      <p class="muted" style="margin: 6px 0 12px;" id="errModalMeta">—</p>
      <div class="slider-group">
        <label for="errGroupSelect">Chọn 1 trong 8 nhóm lỗi chẩn đoán</label>
        <select id="errGroupSelect"></select>
      </div>
      <div class="slider-group">
        <label for="errNoteInput">Nguyên nhân sai / Bước nhầm cần vá</label>
        <textarea id="errNoteInput" placeholder="Ví dụ: Quên kiểm tra điều kiện nguyên, nhầm x₀ với f(x₀), sai dấu tích vô hướng..."></textarea>
      </div>
      <div class="tag-row" style="margin-top: 14px; justify-content: flex-end;">
        <button type="button" class="btn btn-sm" id="btnCloseModal">Hủy</button>
        <button type="button" class="btn btn-sm btn-primary" id="btnSaveErrLog">Lưu vào Nhật ký</button>
      </div>
    </div>
  </div>

  <script src="../assets/common.js"></script>
  <script src="data_tln_van_dung.js"></script>
  <script>
    (function () {
      'use strict';
      var C = window.TOAN_COMMON;
      var D = window.TOAN_TLN_VANDUNG;
      var HOT = { meta: {}, danh_sach_cau: [] };
      var schoolItems = [];
      var questionsById = new Map();
      var tabRequest = 0;
      C.initTheme();

      var validTabs = ['tongquan', 'cd1', 'cd2', 'cd3', 'cd4', 'cd56', 'hot20', 'de_truong'];
      var params = new URLSearchParams(window.location.search);
      var activeTab = params.get('tab') || 'tongquan';
      if (validTabs.indexOf(activeTab) < 0) activeTab = 'tongquan';

      var panel = document.getElementById('tabPanel');
      var stateInputs = {};
      var stateHotFilter = 'all';
      var stateModalTarget = null;

      function renderExampleCard(vd) {
        questionsById.set(vd.id, vd);
        var capLabel = vd.cap_do === 'VD' ? 'Vận dụng' : 'Hiểu';

        var savedVal = stateInputs[vd.id] || '';
        return '<article class="card question-card" id="vd-' + vd.id + '">' +
          '<div class="q-header">' +
            '<div class="tag-row">' +
              '<strong>' + vd.nhan + '</strong>' +
              '<span class="badge badge-accent">' + vd.ma_lenh + '</span>' +
              '<span class="badge">' + capLabel + '</span>' +
              '<span class="badge badge-info">' + vd.nang_luc + '</span>' +
            '</div>' +
            '<span class="muted question-meta">Mục ' + vd.tieu_muc + (vd.nguon ? ' · ' + C.questionSource(vd) : '') + '</span>' +
          '</div>' +
          '<div class="q-stem">' + vd.de_bai + '</div>' +
          C.questionHint(vd) +
          '<div class="tln-box">' +
            '<input type="text" class="tln-input" maxlength="6" inputmode="decimal" value="' + savedVal.replace(/"/g, '&quot;') + '" data-vd-input="' + vd.id + '" placeholder="Tối đa 4 ký tự" aria-label="Đáp án ' + vd.nhan + '">' +
            '<button type="button" class="btn btn-sm btn-primary" data-vd-check="' + vd.id + '">Kiểm tra đáp số</button>' +
            '<button type="button" class="btn btn-sm" data-vd-sol-btn="' + vd.id + '" aria-expanded="false" aria-controls="vd-sol-' + vd.id + '">Xem lời giải</button>' +
            '<button type="button" class="btn btn-sm" style="display: none;" data-vd-log="' + vd.id + '">Đẩy vào Nhật ký lỗi</button>' +
          '</div>' +
          '<div style="margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">' +
            '<span class="muted" style="font-size: 0.88rem;">' + vd.quy_tac_lam_tron + '</span>' +
            '<span class="badge badge-err" style="display: none;" data-vd-warn="' + vd.id + '"></span>' +
            '<span class="answer-feedback" role="status" data-vd-res="' + vd.id + '"></span>' +
          '</div>' +
          '<div class="solution-box" id="vd-sol-' + vd.id + '" hidden></div>' +
        '</article>';
      }

      function renderOverview() {
        var rowsMaTran = D.ma_tran_tln.map(function (r) {
          return '<tr>' +
            '<td><strong>' + r.cau + '</strong></td>' +
            '<td>' + r.chu_de + '</td>' +
            '<td>' + r.noi_dung + '</td>' +
            '<td><span class="badge badge-accent">' + r.ma_lenh + '</span></td>' +
            '<td><span class="badge ' + (r.cap_do === 'Vận dụng' ? 'badge-warn' : 'badge-info') + '">' + r.cap_do + '</span></td>' +
          '</tr>';
        }).join('');

        var rowsBay = D.chien_luoc_bay.map(function (b) {
          return '<tr>' +
            '<td><strong>' + b.ma_cau + '</strong></td>' +
            '<td>' + b.cong_cu + '</td>' +
            '<td>' + b.bay_can_tranh + '</td>' +
          '</tr>';
        }).join('');

        var luuYList = D.pham_vi_luu_y.map(function (txt) {
          return '<li>' + txt + '</li>';
        }).join('');

        return '<section class="section">' +
          '<div class="section-head">' +
            '<div>' +
              '<h2>Phân tích Ma trận Dạng thức 3 (6 câu Trả lời ngắn • 3,00 điểm)</h2>' +
              '<p>Gồm 0 câu Biết, 2 câu Hiểu (C5, C6) và 4 câu Vận dụng phân hóa (C1, C2, C3, C4).</p>' +
            '</div>' +
            '<a class="btn btn-sm" href="../tai_lieu.html?doc=luyen_tap/chuyen_de_tln_van_dung.md">Đọc bản Tài liệu đầy đủ</a>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table><thead><tr><th>Câu</th><th>Chủ đề lớn</th><th>Nội dung kiến thức cụ thể</th><th>Mã năng lực</th><th>Cấp độ</th></tr></thead>' +
            '<tbody>' + rowsMaTran + '</tbody></table>' +
          '</div>' +
          '<div class="notice" style="margin-top: 16px;">' +
            '<strong>Lưu ý phạm vi ma trận &amp; Quy tắc phiếu tô 4 ký tự:</strong>' +
            '<ul class="step-list" style="margin-top: 8px;">' + luuYList + '</ul>' +
          '</div>' +
        '</section>' +
        '<section class="section">' +
          '<div class="section-head">' +
            '<div>' +
              '<h2>Chiến lược giải nhanh &amp; Bẫy cần tránh ở 4 câu Vận dụng</h2>' +
              '<p>Đối chiếu trực tiếp công cụ cốt lõi và các lỗi mất điểm phổ biến theo ma trận 2026.</p>' +
            '</div>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table><thead><tr><th>Mã câu</th><th>Công cụ giải nhanh cốt lõi</th><th>Bẫy sai lầm thường gặp cần tránh</th></tr></thead>' +
            '<tbody>' + rowsBay + '</tbody></table>' +
          '</div>' +
        '</section>' +
        '<section class="section">' +
          '<div class="section-head">' +
            '<div>' +
              '<h2>Bộ đề tự luyện Trả lời ngắn chuẩn Ma trận 2026</h2>' +
              '<p>Mỗi đề gồm đủ 6 câu (4 Vận dụng C1–C4 + 2 Hiểu C5–C6), chấm 0,50đ/câu và kiểm tra phiếu tô tối đa 4 ký tự.</p>' +
            '</div>' +
          '</div>' +
          '<div class="grid grid-2">' +
            '<a class="card card-link" href="phong_thi_toan.html?mode=tln_de1">' +
              '<div>' +
                '<div class="card-title">Đề tự luyện số 01 (6 câu • 30 phút)</div>' +
                '<p class="muted">Gấp hộp bìa 12 cm, khôi phục hàm bậc 3, bắn 3 viên đạn, treo vật 3 dây nghiêng 30°, hình bình hành Oxyz, khoảng cách S.ABC.</p>' +
              '</div>' +
              '<div class="tag-row"><span class="btn btn-sm btn-primary">Bắt đầu Đề tự luyện 01</span></div>' +
            '</a>' +
            '<a class="card card-link" href="phong_thi_toan.html?mode=tln_de2">' +
              '<div>' +
                '<div class="card-title">Đề tự luyện số 02 (6 câu • 30 phút)</div>' +
                '<p class="muted">Chi phí trung bình sp, hàm nhất biến (đáp số âm -3), bốc bi xanh, hợp lực 3 vectơ góc 60°, cos góc Oxyz, khoảng cách AA\' và BD.</p>' +
              '</div>' +
              '<div class="tag-row"><span class="btn btn-sm btn-primary">Bắt đầu Đề tự luyện 02</span></div>' +
            '</a>' +
            '<a class="card card-link" href="phong_thi_toan.html?mode=tln_hot20">' +
              '<div>' +
                '<div class="card-title">Tuyển tập 20 câu TLN Đề "HOT" 2026 (20 câu • 90 phút)</div>' +
                '<p class="muted">Đề chính thức TN THPT 2026 (Mã 101) &amp; đề Sở/Trường mới nhất (15 Vận dụng C1–C4 + 5 Hiểu C5–C6), chấm thang 10 chuẩn phiếu tô.</p>' +
              '</div>' +
              '<div class="tag-row"><span class="btn btn-sm btn-primary">Thi 20 câu HOT (Thang 10)</span></div>' +
            '</a>' +
            '<a class="card card-link" href="phong_thi_toan.html?mode=tln_hot_vd">' +
              '<div>' +
                '<div class="card-title">Luyện 15 câu Vận dụng "HOT" 2026 (C1–C4 • 75 phút)</div>' +
                '<p class="muted">Chuyên sâu 15 câu phân hóa từ bộ Đề "HOT" 2026 thuộc 4 vị trí Vận dụng: GTLN–GTNN, Khảo sát hàm, Xác suất &amp; Vectơ 3D.</p>' +
              '</div>' +
              '<div class="tag-row"><span class="btn btn-sm btn-primary">Luyện 15 câu Vận dụng</span></div>' +
            '</a>' +
          '</div>' +
        '</section>';
      }

      function renderTopicTab(tabKey) {
        var topic = D.chuyen_de.filter(function (c) { return c.key === tabKey; })[0];
        if (!topic) return '';
        var vds = D.vi_du_chuyen_de.filter(function (v) { return v.chuyen_de_key === tabKey; });

        var quyTrinhHtml = '';
        if (topic.quy_trinh && topic.quy_trinh.length) {
          quyTrinhHtml = '<h3 style="margin: 18px 0 8px;">Quy trình giải chuẩn 4 bước</h3><ol class="step-list">' +
            topic.quy_trinh.map(function (st) { return '<li>' + st + '</li>'; }).join('') +
            '</ol>';
        }

        var gridCls = topic.dang_bai.length >= 3 ? 'grid grid-3' : 'grid grid-2';
        var dangHtml = topic.dang_bai.map(function (d) {
          return '<article class="card">' +
            '<h3 style="margin-bottom: 10px;">' + d.ten + '</h3>' +
            '<p><strong>Nhận diện:</strong> ' + d.nhan_dien + '</p>' +
            '<p><strong>Công thức / Phương pháp:</strong> ' + d.cong_thuc + '</p>' +
          '</article>';
        }).join('');

        var examplesHtml = vds.map(renderExampleCard).join('');
        var hotItems = (HOT.danh_sach_cau || []).filter(function (q) { return q.chuyen_de_key === tabKey; });
        var hotSectionHtml = '';
        if (hotItems.length) {
          hotSectionHtml = '<section class="section">' +
            '<div class="section-head">' +
              '<div>' +
                '<h2>Bài tập trích Đề thi "HOT" 2026 thuộc chuyên đề này (' + hotItems.length + ' câu)</h2>' +
                '<p>Tuyển chọn từ Đề chính thức TN THPT 2026 (Mã 101) và đề các Sở/Trường mới nhất.</p>' +
              '</div>' +
              '<a class="btn btn-sm" href="phong_thi_toan.html?mode=tln_hot20">Mở Phòng thi 20 câu HOT</a>' +
            '</div>' +
            hotItems.map(renderExampleCard).join('') +
          '</section>';
        }

        return '<section class="section">' +
          '<div class="card">' +
            '<div class="section-head" style="margin-bottom: 8px;">' +
              '<div><h2>' + topic.tieu_de + '</h2></div>' +
              '<a class="btn btn-sm btn-primary" href="' + topic.truc_quan_link + '">' + topic.truc_quan_label + '</a>' +
            '</div>' +
            '<p>' + topic.dinh_huong + '</p>' +
            quyTrinhHtml +
          '</div>' +
        '</section>' +
        '<section class="section">' +
          '<h2 style="margin-bottom: 16px;">Phân loại dạng bài trọng tâm</h2>' +
          '<div class="' + gridCls + '">' + dangHtml + '</div>' +
        '</section>' +
        '<section class="section">' +
          '<div class="section-head">' +
            '<div>' +
              '<h2>Ví dụ minh họa tương tác (' + vds.length + ' bài)</h2>' +
              '<p>Tự nháp và nhập đáp số chuẩn phiếu tô (tối đa 4 ký tự) trước khi mở lời giải chi tiết.</p>' +
            '</div>' +
            '<a class="btn btn-sm" href="phong_thi_toan.html?mode=tln_vd">Thi thử cả 14 Ví dụ</a>' +
          '</div>' +
          examplesHtml +
        '</section>' +
        hotSectionHtml + renderSchoolQuestions(schoolItems.filter(function (q) { return q.chuyen_de_key === tabKey; }));
      }

      function renderSchoolQuestions(items) {
        if (!items.length) return '';
        return '<section class="section"><div class="section-head"><div><h2>Trả lời ngắn từ đề trường</h2>' +
          '<p>' + items.length + ' bài. Mở gợi ý khi cần, sau đó nhập đáp số để tự kiểm tra.</p></div>' +
          '<div class="tag-row"><a class="btn btn-sm" href="phong_thi_toan.html?mode=truong_a">Luyện cả bộ A</a>' +
          '<a class="btn btn-sm" href="phong_thi_toan.html?mode=truong_b">Luyện cả bộ B</a></div></div>' +
          items.map(renderExampleCard).join('') + '</section>';
      }

      function renderHot20Tab() {
        var allHot = HOT.danh_sach_cau || [];
        var filtered = stateHotFilter === 'all'
          ? allHot
          : allHot.filter(function (q) { return q.ma_lenh === stateHotFilter; });

        var filters = [
          { key: 'all', label: 'Tất cả (' + allHot.length + ')' },
          { key: 'C1-MHH2.2', label: 'C1-MHH2.2 (4)' },
          { key: 'C2-GQ2.2', label: 'C2-GQ2.2 (3)' },
          { key: 'C3-MHH2.2', label: 'C3-MHH2.2 (5)' },
          { key: 'C4-MHH2.2', label: 'C4-MHH2.2 (3)' },
          { key: 'C5-GQ2.2', label: 'C5-GQ2.2 (2)' },
          { key: 'C6-GQ2.1', label: 'C6-GQ2.1 (3)' }
        ];
        var filterBar = '<div class="tag-row" style="margin-bottom: 20px;">' +
          filters.map(function (f) {
            var cls = stateHotFilter === f.key ? 'btn btn-sm btn-primary' : 'btn btn-sm';
            return '<button type="button" class="' + cls + '" data-hot-filter="' + f.key + '">' + f.label + '</button>';
          }).join('') +
        '</div>';

        return '<section class="section">' +
          '<div class="card">' +
            '<div class="section-head" style="margin-bottom: 10px;">' +
              '<div><h2>' + (HOT.meta.tieu_de || 'Tuyển tập 20 câu Trả lời ngắn Đề "HOT" 2026') + '</h2></div>' +
              '<div class="tag-row">' +
                '<a class="btn btn-sm btn-primary" href="phong_thi_toan.html?mode=tln_hot20">Thi 20 câu (90\')</a>' +
                '<a class="btn btn-sm" href="phong_thi_toan.html?mode=tln_hot_vd">Luyện 15 câu VD (75\')</a>' +
                '<a class="btn btn-sm" href="phong_thi_toan.html?mode=tln_hot_h">Luyện 5 câu Hiểu (25\')</a>' +
                '<a class="btn btn-sm" href="../tai_lieu.html?doc=luyen_tap/tuyen_tap_20_cau_tln_hot_2026.md">Bản đọc Markdown</a>' +
              '</div>' +
            '</div>' +
            '<p><strong>Nguồn tuyển chọn:</strong> ' + (HOT.meta.nguon_tong_hop || '') + '</p>' +
          '</div>' +
        '</section>' +
        '<section class="section">' +
          '<div class="section-head">' +
            '<div>' +
              '<h2>Luyện tương tác từng câu (' + filtered.length + ' câu đang hiển thị)</h2>' +
              '<p>Tự giải nháp, nhập đáp số tối đa 4 ký tự để đối chiếu tức thì trước khi mở lời giải 6 bước.</p>' +
            '</div>' +
          '</div>' +
          filterBar +
          filtered.map(renderExampleCard).join('') +
        '</section>';
      }

      function bindTabPanelEvents() {
        panel.querySelectorAll('[data-hot-filter]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            stateHotFilter = btn.getAttribute('data-hot-filter') || 'all';
            renderActiveTab('hot20');
          });
        });

        panel.querySelectorAll('[data-vd-input]').forEach(function (inp) {
          inp.addEventListener('input', function () {
            var id = inp.getAttribute('data-vd-input');
            stateInputs[id] = inp.value;
            var warn = panel.querySelector('[data-vd-warn="' + id + '"]');
            var res = panel.querySelector('[data-vd-res="' + id + '"]');
            res.textContent = '';
            res.className = 'answer-feedback';
            panel.querySelector('[data-vd-log="' + id + '"]').style.display = 'none';
            var v = C.validateShortAnswer(inp.value);
            if (!v.valid) {
              warn.style.display = 'inline-flex';
              warn.textContent = v.reason;
            } else {
              warn.style.display = 'none';
              warn.textContent = '';
            }
          });
        });

        panel.querySelectorAll('[data-vd-check]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-vd-check');
            var vd = questionsById.get(id);
            var inp = panel.querySelector('[data-vd-input="' + id + '"]');
            var resBadge = panel.querySelector('[data-vd-res="' + id + '"]');
            var logBtn = panel.querySelector('[data-vd-log="' + id + '"]');
            if (!vd || !inp || !resBadge) return;

            var raw = inp.value;
            var v = C.validateShortAnswer(raw);
            if (!v.valid || v.empty) {
              resBadge.className = 'answer-feedback feedback-warn';
              resBadge.style.display = 'inline-flex';
              resBadge.textContent = v.empty ? 'Hãy nhập đáp số trước khi kiểm tra.' : v.reason;
              return;
            }
            var ok = C.compareShortAnswer(raw, vd.dap_an);
            resBadge.style.display = 'inline-flex';
            if (ok) {
              resBadge.className = 'answer-feedback feedback-ok';
              resBadge.textContent = 'Chính xác! Đáp số chuẩn phiếu tô: ' + vd.dap_an;
              if (logBtn) logBtn.style.display = 'none';
            } else {
              resBadge.className = 'answer-feedback feedback-err';
              resBadge.textContent = 'Chưa đúng. ' + (vd.bay || 'Hãy rà lại điều kiện, đơn vị và quy tắc làm tròn rồi thử lại.');
              if (logBtn) logBtn.style.display = 'inline-flex';
            }
          });
        });

        panel.querySelectorAll('[data-vd-sol-btn]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-vd-sol-btn');
            var box = document.getElementById('vd-sol-' + id);
            if (!box) return;
            var vd = questionsById.get(id);
            if (box.hidden && !box.hasChildNodes()) {
              box.innerHTML = C.solutionSteps(vd) + '<p class="answer-key"><strong>Đáp số điền phiếu</strong> ' + vd.dap_an + '</p>';
            }
            box.hidden = !box.hidden;
            btn.setAttribute('aria-expanded', String(!box.hidden));
            btn.textContent = box.hidden ? 'Xem lời giải' : 'Ẩn lời giải';
          });
        });

        panel.querySelectorAll('[data-vd-log]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-vd-log');
            var vd = questionsById.get(id);
            if (!vd) return;
            openErrModal(vd);
          });
        });
      }

      async function renderActiveTab(tabKey) {
        var request = ++tabRequest;
        activeTab = tabKey;
        document.querySelectorAll('[data-tln-tab]').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-tln-tab') === tabKey);
          b.setAttribute('aria-pressed', String(b.getAttribute('data-tln-tab') === tabKey));
        });
        var banks = [];
        if (tabKey !== 'tongquan' && tabKey !== 'de_truong') banks.push('data_tln_hot_2026.js');
        if (['de_truong', 'cd1', 'cd2', 'cd3', 'cd4'].includes(tabKey)) banks.push('data_de_truong.js');
        panel.setAttribute('aria-busy', 'true');
        panel.textContent = 'Đang mở chuyên đề…';
        try {
          await Promise.all(banks.map(C.loadQuestionBank));
        } catch (err) {
          if (request !== tabRequest) return;
          panel.textContent = 'Chưa tải được bộ câu hỏi. Chọn lại chuyên đề để thử lại.';
          panel.setAttribute('aria-busy', 'false');
          return;
        }
        if (request !== tabRequest) return;
        HOT = window.TOAN_TLN_HOT_2026 || HOT;
        if (window.TOAN_DE_TRUONG && !schoolItems.length) {
          var packs = window.TOAN_DE_TRUONG;
          schoolItems = packs.a.concat(packs.b).filter(function (q) { return q.phan === 'TLN'; });
        }
        questionsById.clear();
        if (tabKey === 'tongquan') panel.innerHTML = renderOverview();
        else if (tabKey === 'hot20') panel.innerHTML = renderHot20Tab();
        else if (tabKey === 'de_truong') panel.innerHTML = renderSchoolQuestions(schoolItems);
        else panel.innerHTML = renderTopicTab(tabKey);
        panel.setAttribute('aria-busy', 'false');
        bindTabPanelEvents();
      }

      document.querySelectorAll('[data-tln-tab]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var key = btn.getAttribute('data-tln-tab');
          renderActiveTab(key);
          try {
            history.replaceState(null, '', '?tab=' + encodeURIComponent(key));
          } catch (e) {}
        });
      });

      /* Modal đẩy lỗi */
      var errModal = document.getElementById('errModal');
      var errGroupSelect = document.getElementById('errGroupSelect');
      errGroupSelect.innerHTML = C.ERROR_GROUPS.map(function (g) {
        return '<option value="' + g + '">' + g + '</option>';
      }).join('');

      function openErrModal(vd) {
        stateModalTarget = vd;
        document.getElementById('errModalMeta').textContent =
          'Thẻ gắn tự động: [' + vd.ma_lenh + '] + [Cấp độ: ' + vd.cap_do + '] + [Năng lực: ' + vd.nang_luc + ']';
        document.getElementById('errNoteInput').value = '';
        errModal.classList.add('open');
      }

      document.getElementById('btnCloseModal').addEventListener('click', function () {
        errModal.classList.remove('open');
      });

      document.getElementById('btnSaveErrLog').addEventListener('click', function () {
        var vd = stateModalTarget;
        if (!vd) return;
        C.addErrorLog({
          chu_de: vd.chu_de,
          ma_lenh: vd.ma_lenh,
          cap_do: vd.cap_do,
          nang_luc: vd.nang_luc,
          tom_tat: vd.nhan + ' (Mục ' + vd.tieu_muc + ')',
          nhom_loi: errGroupSelect.value,
          ghi_chu: document.getElementById('errNoteInput').value
        });
        errModal.classList.remove('open');
        var btn = panel.querySelector('[data-vd-log="' + vd.id + '"]');
        if (btn) {
          btn.textContent = 'Đã lưu Nhật ký lỗi';
          btn.classList.add('btn-ok');
          btn.disabled = true;
        }
      });

      renderActiveTab(activeTab);
    })();
  </script>
</body>
</html>
