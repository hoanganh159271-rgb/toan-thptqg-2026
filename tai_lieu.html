<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Tài liệu Toán THPTQG 2026 — GDPT 2018</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="topbar-brand">
        <a class="btn btn-sm" href="index.html">← Dashboard</a>
        <h1 id="docTitle">Kho Tài liệu Toán THPTQG 2026</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-sm" type="button" data-theme-toggle>Chế độ Tối</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="lab-layout">
      <aside class="card" aria-label="Danh mục tài liệu">
        <h3>Danh mục tài liệu</h3>
        <div id="docNav" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;"></div>
      </aside>

      <article class="card" id="docContent" style="min-width: 0;"></article>
    </div>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/docs_data.js"></script>
  <script>
    (function () {
      'use strict';
      var C = window.TOAN_COMMON;
      var DOCS = window.TOAN_DOCS || {};
      C.initTheme();

      var DOC_LIST = [
        { key: 'kb/01_ung_dung_dao_ham.md', label: 'Chủ đề 1: Ứng dụng đạo hàm' },
        { key: 'kb/02_luong_giac_day_so_mu_log.md', label: 'Chủ đề 2: Lượng giác, Dãy số, Mũ–Log' },
        { key: 'kb/03_to_hop_xac_suat.md', label: 'Chủ đề 3: Tổ hợp – Xác suất' },
        { key: 'kb/04_vecto_khong_gian.md', label: 'Chủ đề 4: Vectơ không gian & Oxyz' },
        { key: 'kb/05_quan_he_vuong_goc.md', label: 'Chủ đề 5: Quan hệ vuông góc 3D' },
        { key: 'luyen_tap/chuyen_de_tln_van_dung.md', label: 'Chuyên đề TLN Vận dụng (PDF 2026)' },
        { key: 'luyen_tap/kho_mhh_van_dung.md', label: 'Kho rèn Mô hình hóa (MHH)' },
        { key: 'chan_doan/checklist_truoc_khi_thi.md', label: 'Checklist trước khi thi' },
        { key: 'chan_doan/nhat_ky_loi_sai.md', label: 'Nhật ký lỗi sai (8 nhóm)' }
      ];

      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function readBraceGroup(str, idx) {
        if (idx >= str.length) return { content: '', next: idx };
        if (str.charAt(idx) !== '{') {
          if (str.charAt(idx) === '\\') {
            var cmdM = /^\\[A-Za-z]+/.exec(str.slice(idx));
            if (cmdM) return { content: cmdM[0], next: idx + cmdM[0].length };
            return { content: str.slice(idx, idx + 2), next: idx + 2 };
          }
          return { content: str.charAt(idx), next: idx + 1 };
        }
        var depth = 0;
        var i = idx;
        while (i < str.length) {
          var ch = str.charAt(i);
          if (ch === '\\' && i + 1 < str.length) { i += 2; continue; }
          if (ch === '{') depth++;
          else if (ch === '}') {
            depth--;
            if (depth === 0) {
              return { content: str.slice(idx + 1, i), next: i + 1 };
            }
          }
          i++;
        }
        return { content: str.slice(idx + 1), next: str.length };
      }

      var TEX_SYMBOLS = {
        Leftrightarrow: '⇔', Rightarrow: '⇒', Leftarrow: '⇐', leftrightarrow: '↔',
        to: '→', mapsto: '↦', le: '≤', leq: '≤', ge: '≥', geq: '≥',
        neq: '≠', ne: '≠', approx: '≈', equiv: '≡', cdot: '·', times: '×',
        pm: '±', mp: '∓', infty: '∞', circ: '°', pi: 'π', alpha: 'α',
        beta: 'β', gamma: 'γ', theta: 'θ', varphi: 'φ', phi: 'φ',
        Delta: 'Δ', Omega: 'Ω', Sigma: '∑', sum: '∑', prod: '∏',
        in: '∈', notin: '∉', subset: '⊂', subseteq: '⊆', cup: '∪', cap: '∩',
        varnothing: '∅', emptyset: '∅', perp: '⊥', parallel: '∥',
        forall: '∀', exists: '∃', dots: '…', ldots: '…', cdots: '⋯',
        lfloor: '⌊', rfloor: '⌋', lceil: '⌈', rceil: '⌉',
        lvert: '|', rvert: '|', lVert: '‖', rVert: '‖', mid: '|',
        lim: 'lim', max: 'max', min: 'min', log: 'log', ln: 'ln',
        sin: 'sin', cos: 'cos', tan: 'tan', cot: 'cot', arccos: 'arccos',
        arcsin: 'arcsin', arctan: 'arctan', deg: 'deg', prime: '′',
        quad: ' ', qquad: '  '
      };

      var BB_MAP = { R: 'ℝ', Z: 'ℤ', N: 'ℕ', Q: 'ℚ', C: 'ℂ' };

      function renderMathOffline(escTex) {
        var s = String(escTex || '');
        var out = '';
        var i = 0;
        while (i < s.length) {
          var ch = s.charAt(i);

          if (ch === '\\') {
            var nextCh = s.charAt(i + 1);
            if (nextCh === '{' || nextCh === '}') {
              out += nextCh;
              i += 2;
              continue;
            }
            if (nextCh === ';' || nextCh === ',' || nextCh === ' ' || nextCh === '!') {
              out += nextCh === '!' ? '' : '&thinsp;';
              i += 2;
              continue;
            }
            if (nextCh === '\\') {
              out += '<br>';
              i += 2;
              continue;
            }
            var m = /^\\([A-Za-z]+)/.exec(s.slice(i));
            if (m) {
              var cmd = m[1];
              var pos = i + m[0].length;
              if (cmd === 'left' || cmd === 'right') {
                if (s.charAt(pos) === '.') pos++;
                i = pos;
                continue;
              }
              if (cmd === 'begin' || cmd === 'end') {
                var gEnv = readBraceGroup(s, pos);
                pos = gEnv.next;
                if (cmd === 'begin' && gEnv.content === 'array') {
                  var gSpec = readBraceGroup(s, pos);
                  pos = gSpec.next;
                }
                i = pos;
                continue;
              }
              if (cmd === 'dfrac' || cmd === 'frac') {
                while (s.charAt(pos) === ' ') pos++;
                var gNum = readBraceGroup(s, pos);
                pos = gNum.next;
                while (s.charAt(pos) === ' ') pos++;
                var gDen = readBraceGroup(s, pos);
                out += '<span class="mfrac"><span class="mnum">' + renderMathOffline(gNum.content) + '</span><span class="mden">' + renderMathOffline(gDen.content) + '</span></span>';
                i = gDen.next;
                continue;
              }
              if (cmd === 'sqrt') {
                while (s.charAt(pos) === ' ') pos++;
                var rootIdx = '';
                if (s.charAt(pos) === '[') {
                  var rb = s.indexOf(']', pos);
                  if (rb > pos) {
                    rootIdx = '<sup style="margin-right:1px;">' + renderMathOffline(s.slice(pos + 1, rb)) + '</sup>';
                    pos = rb + 1;
                  }
                }
                while (s.charAt(pos) === ' ') pos++;
                var gSq = readBraceGroup(s, pos);
                out += rootIdx + '<span class="msqrt"><span class="mrad">' + renderMathOffline(gSq.content) + '</span></span>';
                i = gSq.next;
                continue;
              }
              if (cmd === 'overrightarrow' || cmd === 'vec') {
                while (s.charAt(pos) === ' ') pos++;
                var gVec = readBraceGroup(s, pos);
                out += '<span class="mvec">' + renderMathOffline(gVec.content) + '</span>';
                i = gVec.next;
                continue;
              }
              if (cmd === 'widehat' || cmd === 'hat') {
                while (s.charAt(pos) === ' ') pos++;
                var gHat = readBraceGroup(s, pos);
                out += '<span class="mhat">' + renderMathOffline(gHat.content) + '</span>';
                i = gHat.next;
                continue;
              }
              if (cmd === 'overline' || cmd === 'bar') {
                while (s.charAt(pos) === ' ') pos++;
                var gBar = readBraceGroup(s, pos);
                out += '<span style="text-decoration: overline;">' + renderMathOffline(gBar.content) + '</span>';
                i = gBar.next;
                continue;
              }
              if (cmd === 'text' || cmd === 'mathrm') {
                while (s.charAt(pos) === ' ') pos++;
                var gTxt = readBraceGroup(s, pos);
                out += '<span style="font-family: var(--font-sans); font-style: normal;">' + gTxt.content + '</span>';
                i = gTxt.next;
                continue;
              }
              if (cmd === 'mathbb') {
                while (s.charAt(pos) === ' ') pos++;
                var gBb = readBraceGroup(s, pos);
                var key = gBb.content.trim();
                out += BB_MAP[key] || ('<strong>' + key + '</strong>');
                i = gBb.next;
                continue;
              }
              if (Object.prototype.hasOwnProperty.call(TEX_SYMBOLS, cmd)) {
                out += TEX_SYMBOLS[cmd];
                i = pos;
                continue;
              }
              out += cmd;
              i = pos;
              continue;
            }
            i++;
            continue;
          }

          if (ch === '{') {
            var grp = readBraceGroup(s, i);
            out += grp.content === ',' ? ',' : renderMathOffline(grp.content);
            i = grp.next;
            continue;
          }

          if (ch === '^') {
            var gSup = readBraceGroup(s, i + 1);
            var supHtml = renderMathOffline(gSup.content.trim());
            if (supHtml === '°') out += '°';
            else if (supHtml === '′') out += '′';
            else out += '<sup>' + supHtml + '</sup>';
            i = gSup.next;
            continue;
          }

          if (ch === '_') {
            var gSub = readBraceGroup(s, i + 1);
            out += '<sub>' + renderMathOffline(gSub.content.trim()) + '</sub>';
            i = gSub.next;
            continue;
          }

          if (ch === "'") {
            out += '′';
            i++;
            continue;
          }

          out += ch;
          i++;
        }
        return out;
      }

      function formatInline(raw) {
        var s = esc(raw);
        var tokens = [];
        var pushTok = function (html) {
          var idx = tokens.length;
          tokens.push(html);
          return '\u0001TOK' + idx + '\u0002';
        };
        s = s.replace(/\$\$([^$]+)\$\$/g, function (_, m) {
          return pushTok('<span class="mwrap">' + renderMathOffline(m) + '</span>');
        });
        s = s.replace(/\$([^$]+)\$/g, function (_, m) {
          return pushTok('<span class="mwrap">' + renderMathOffline(m) + '</span>');
        });
        s = s.replace(/`([^`]+)`/g, function (_, c) {
          return pushTok('<code class="mono">' + c + '</code>');
        });
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        s = s.replace(/\u0001TOK(\d+)\u0002/g, function (_, id) {
          return tokens[Number(id)] || '';
        });
        return s;
      }

      function renderMarkdown(md) {
        var lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
        var html = [];
        var i = 0;
        var inUl = false, inOl = false;

        function closeLists() {
          if (inUl) { html.push('</ul>'); inUl = false; }
          if (inOl) { html.push('</ol>'); inOl = false; }
        }

        while (i < lines.length) {
          var line = lines[i];
          var trim = line.trim();

          if (!trim) {
            closeLists();
            i++;
            continue;
          }

          // Block math $$...$$
          if (trim.indexOf('$$') === 0 && trim.lastIndexOf('$$') > 1) {
            closeLists();
            html.push('<div class="mblock">' + renderMathOffline(esc(trim.slice(2, -2).trim())) + '</div>');
            i++;
            continue;
          }
          if (trim === '$$') {
            closeLists();
            var mLines = [];
            i++;
            while (i < lines.length && lines[i].trim() !== '$$') {
              mLines.push(lines[i]);
              i++;
            }
            if (i < lines.length && lines[i].trim() === '$$') i++;
            html.push('<div class="mblock">' + renderMathOffline(esc(mLines.join(' ').trim())) + '</div>');
            continue;
          }

          // Table
          if (trim.charAt(0) === '|' && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|/.test(lines[i + 1])) {
            closeLists();
            var parseRow = function (r) {
              var trimmed = r.trim().replace(/^\|/, '').replace(/\|$/, '');
              var cells = [];
              var cur = '';
              var inMath = false;
              var inCode = false;
              for (var k = 0; k < trimmed.length; k++) {
                var c = trimmed.charAt(k);
                if (c === '\\' && k + 1 < trimmed.length && trimmed.charAt(k + 1) === '|') {
                  cur += '|';
                  k++;
                  continue;
                }
                if (c === '`' && !inMath) { inCode = !inCode; cur += c; continue; }
                if (c === '$' && !inCode) { inMath = !inMath; cur += c; continue; }
                if (c === '|' && !inMath && !inCode) {
                  cells.push(cur.trim());
                  cur = '';
                } else {
                  cur += c;
                }
              }
              cells.push(cur.trim());
              return cells;
            };
            var headers = parseRow(line);
            html.push('<div class="table-wrap" style="margin: 14px 0;"><table><thead><tr>');
            headers.forEach(function (h) { html.push('<th>' + formatInline(h) + '</th>'); });
            html.push('</tr></thead><tbody>');
            i += 2;
            while (i < lines.length && lines[i].trim().charAt(0) === '|') {
              var cols = parseRow(lines[i]);
              html.push('<tr>');
              cols.forEach(function (c) { html.push('<td>' + formatInline(c) + '</td>'); });
              html.push('</tr>');
              i++;
            }
            html.push('</tbody></table></div>');
            continue;
          }

          if (/^---+$/.test(trim)) {
            closeLists();
            html.push('<div style="height: 20px;"></div>');
            i++;
            continue;
          }

          var hMatch = /^(#{1,4})\s+(.*)$/.exec(trim);
          if (hMatch) {
            closeLists();
            var lvl = hMatch[1].length;
            var tag = lvl === 1 ? 'h2' : (lvl === 2 ? 'h3' : 'h4');
            var mt = lvl <= 2 ? 'margin: 22px 0 10px;' : 'margin: 14px 0 6px;';
            html.push('<' + tag + ' style="' + mt + '">' + formatInline(hMatch[2]) + '</' + tag + '>');
            i++;
            continue;
          }

          if (trim.indexOf('> ') === 0) {
            closeLists();
            var qLines = [];
            while (i < lines.length && lines[i].trim().indexOf('> ') === 0) {
              qLines.push(formatInline(lines[i].trim().slice(2)));
              i++;
            }
            html.push('<div class="notice" style="margin: 12px 0;">' + qLines.join('<br>') + '</div>');
            continue;
          }

          var ulMatch = /^[-*]\s+(.*)$/.exec(trim);
          if (ulMatch) {
            if (inOl) { html.push('</ol>'); inOl = false; }
            if (!inUl) { html.push('<ul class="step-list" style="margin: 8px 0 12px;">'); inUl = true; }
            html.push('<li>' + formatInline(ulMatch[1]) + '</li>');
            i++;
            continue;
          }

          var olMatch = /^\d+\.\s+(.*)$/.exec(trim);
          if (olMatch) {
            if (inUl) { html.push('</ul>'); inUl = false; }
            if (!inOl) { html.push('<ol class="step-list" style="margin: 8px 0 12px;">'); inOl = true; }
            html.push('<li>' + formatInline(olMatch[1]) + '</li>');
            i++;
            continue;
          }

          closeLists();
          html.push('<p>' + formatInline(trim) + '</p>');
          i++;
        }
        closeLists();
        return html.join('\n');
      }

      var params = new URLSearchParams(window.location.search);
      var currentDoc = params.get('doc') || DOC_LIST[0].key;
      if (!DOCS[currentDoc]) currentDoc = DOC_LIST[0].key;

      var navEl = document.getElementById('docNav');
      var contentEl = document.getElementById('docContent');

      function selectDoc(key) {
        currentDoc = key;
        var found = DOC_LIST.filter(function (d) { return d.key === key; })[0];
        document.getElementById('docTitle').textContent = found ? found.label : 'Kho Tài liệu Toán THPTQG 2026';
        contentEl.innerHTML = renderMarkdown(DOCS[key] || 'Không tìm thấy tài liệu.');
        navEl.querySelectorAll('button').forEach(function (b) {
          b.classList.toggle('btn-primary', b.getAttribute('data-doc-key') === key);
        });
      }

      DOC_LIST.forEach(function (d) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-sm';
        btn.style.justifyContent = 'flex-start';
        btn.style.whiteSpace = 'normal';
        btn.style.textAlign = 'left';
        btn.setAttribute('data-doc-key', d.key);
        btn.textContent = d.label;
        btn.addEventListener('click', function () {
          selectDoc(d.key);
          try {
            history.replaceState(null, '', '?doc=' + encodeURIComponent(d.key));
          } catch (e) {}
        });
        navEl.appendChild(btn);
      });

      selectDoc(currentDoc);
    })();
  </script>
</body>
</html>
